<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 7</title>
</head>
<body>

<div *ngIf="errorMessage" style="color: red; padding: 10px; margin: 10px 0; border: 1px solid red; background-color: #ffe6e6;">
  {{ errorMessage }}
</div>

<div>
  <table>
    <tbody>
    <tr *ngFor="let car of carsList; let i = index"
        [ngClass]="{'even-item': i % 2 === 0, 'odd-item': i % 2 !== 0}">
      <td colspan="2">
        <app-car-list-item [car]="car"></app-car-list-item>
        <div style="text-align: center; margin-top: 10px;">
          <button (click)="onDelete(car.id)">Delete</button>
          <button (click)="onEdit(car.id)">Edit</button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>

</html>
