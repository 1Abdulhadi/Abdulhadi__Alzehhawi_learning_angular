<h2>{{ car ? 'Edit Car' : 'Add New Car' }}</h2>

<form [formGroup]="carForm" (ngSubmit)="onSubmit()" class="mat-form">

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>ID</mat-label>
    <input matInput type="number" formControlName="id" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Name</mat-label>
    <input matInput type="text" formControlName="name" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Company</mat-label>
    <input matInput type="text" formControlName="company" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Year</mat-label>
    <input matInput type="number" formControlName="year" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Price</mat-label>
    <input matInput type="number" formControlName="price" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Release Date</mat-label>
    <input matInput type="date" formControlName="releaseDate" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Image URL</mat-label>
    <input matInput type="text" formControlName="imageUrl" />
  </mat-form-field>

  <mat-checkbox formControlName="electric" class="checkbox">Electric</mat-checkbox>

  <div class="button-group">
    <button mat-raised-button color="primary" type="submit">Submit</button>
    <button mat-button type="button" routerLink="/cars">Back to List</button>
  </div>

  <div *ngIf="errorMessage" class="mat-error">{{ errorMessage }}</div>
</form>
