<div *ngIf="car" [appHoverHighlight]="'lightblue'">
  <img *ngIf="car.imageUrl" [src]="car.imageUrl" [alt]="car.name" style="max-width: 300px; border-radius: 8px;">
  <h2>{{ car | carModel | uppercase }}</h2>
  <p><strong>ID:</strong> {{ car.id }}</p>
  <p><strong>Price:</strong> {{ car.price | currency: 'CAD': 'symbol-narrow' }}</p>
  <p><strong>Year:</strong> {{ car.year }}</p>
  <p><strong>Release Date:</strong> {{ car.releaseDate | date: 'fullDate' }}</p>
  <p><strong>Electric:</strong> {{ car.electric ? 'Yes' : 'No' }}</p>
</div>
