<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars models</title>
</head>
<body>
<div class="container">
  <h2>Cars List</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Company</th>
      <th>Year</th>
      <th>Electric</th>
    </tr>
    <tr *ngFor="let car of carsList">
      <td>{{ car.id }}</td>
      <td>{{ car.name }}</td>
      <td>{{ car.company }}</td>
      <td>{{ car.year }}</td>
      <td *ngIf="car.electric">Yes</td>
      <td *ngIf="!car.electric">No</td>
    </tr>
  </table>
</div>
</body>

</html>
